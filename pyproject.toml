[project]
name = "flaskehals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HastingsJack", email = "jackmhastings@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
flaskehals = "flaskehals:main"
flaskehals-sync = "flaskehals.sync:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
